services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oprisk
      POSTGRES_PASSWORD: oprisk
      POSTGRES_DB: oprisk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oprisk -d oprisk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
